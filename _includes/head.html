<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#5b4bd8">
{% seo %}
<link rel="icon" href="{{ '/assets/images/favicon.svg' | relative_url }}" type="image/svg+xml">
<link rel="alternate" href="{{ '/feed.xml' | relative_url }}" type="application/atom+xml" title="{{ site.title }} feed">
<link rel="stylesheet" href="{{ '/assets/css/main.css' | relative_url }}">
<script>
  (() => {
    const configured = {{ site.theme_mode | default: 'system' | jsonify }};
    let saved;
    try { saved = localStorage.getItem('jekyll-elite-theme'); } catch (_) {}
    const system = matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light';
    document.documentElement.dataset.theme = saved || (configured === 'system' ? system : configured);
  })();
</script>
