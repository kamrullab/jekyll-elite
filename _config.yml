title: Jekyll Elite
description: A modern Jekyll theme for the web of 2026.
url: https://kamrullab.github.io
baseurl: /jekyll-elite
lang: en
timezone: Asia/Dhaka
repository: kamrullab/jekyll-elite
author:
  name: KAMRUL HOSSAIN
  url: https://github.com/kamrullab

theme_mode: system
show_excerpts: true

collections:
  projects:
    output: true
    permalink: /work/:name/
  docs:
    output: true
    permalink: /docs/:name/

permalink: /:year/:month/:day/:title/

plugins:
  - jekyll-feed
  - jekyll-seo-tag
  - jekyll-sitemap

feed:
  path: feed.xml

sass:
  style: compressed

defaults:
  - scope:
      path: ""
      type: posts
    values:
      layout: post
  - scope:
      path: ""
      type: projects
    values:
      layout: project
  - scope:
      path: ""
      type: docs
    values:
      layout: docs

exclude:
  - Gemfile
  - Gemfile.lock
  - jekyll-elite.gemspec
  - Rakefile
  - README.md
  - CONTRIBUTING.md
  - SECURITY.md
  - CHANGELOG.md
  - vendor
