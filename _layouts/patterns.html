---
layout: default
---

<header class="page-header wide-header">
  <p class="eyebrow">Included templates</p>
  <h1>{{ page.title }}</h1>
  <p class="lead">{{ page.description }}</p>
</header>

<div class="pattern-grid">
  {% for type in site.data.site_types %}
    <a class="pattern-card" href="{{ type.url | relative_url }}">
      <span class="pattern-number">{{ type.icon }}</span>
      <h2>{{ type.title }}</h2>
      <p>{{ type.description }}</p>
      <span class="card-arrow" aria-hidden="true">↗</span>
    </a>
  {% endfor %}
</div>
